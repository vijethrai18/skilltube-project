<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SkillTube Login - Enter your developer course tracker workspace in local or cloud database sync mode.">
  <title>Welcome to SkillTube - Portal Login</title>
  <link rel="stylesheet" href="style.css?v=2.0">
  
  <style>
    /* Theme overrides */
    :root {
      --bg-dark: #020c1b;
      --bg-darker: #000814;
      --bg-card: rgba(10, 25, 47, 0.6);
      --bg-card-hover: rgba(17, 34, 64, 0.85);
      --primary: #ff4d4d;
      --primary-hover: #e63939;
      --primary-glow: rgba(255, 77, 77, 0.3);
      --border-color: rgba(255, 255, 255, 0.05);
      
      --font-headings: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 50% 0%, rgba(255, 255, 255, 0.05) 0px, transparent 55%),
        radial-gradient(at 0% 100%, rgba(10, 25, 47, 0.5) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 8, 20, 0.7) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      box-shadow: var(--glass-shadow);
      overflow: hidden;
      margin: 0 auto;
    }

    /* Right Form Column (now centered and solo) */
    .login-form-area {
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-logo {
      font-family: var(--font-headings);
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      text-align: center;
    }

    .login-logo span {
      color: var(--primary);
      -webkit-text-fill-color: initial;
    }

    .login-title {
      font-size: 1.8rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      text-align: center;
    }

    /* Tabs */
    .login-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
      gap: 16px;
      justify-content: center;
    }

    .login-tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-headings);
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 16px;
      cursor: pointer;
      position: relative;
      transition: color var(--transition-fast);
    }

    .login-tab-btn:hover {
      color: var(--text-main);
    }

    .login-tab-btn.active {
      color: var(--text-main);
    }

    .login-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px 3px 0 0;
    }

    .form-panel {
      display: none;
    }

    .form-panel.active {
      display: flex;
      flex-direction: column;
    }
    
    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 32px;
    }

    /* Responsive */
    @media (max-width: 576px) {
      .login-form-area {
        padding: 32px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-form-area">
      <!-- Centered Logo -->
      <div class="login-logo"><span>▶</span> SkillTube</div>
      
      <h2 class="login-title">Welcome Back</h2>
      <p class="login-subtitle">Sign in or create an account to access your developer portal.</p>
      
      <div class="login-tabs">
        <button class="login-tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="login-tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="form-panel active" onsubmit="handleLogin(event)" style="gap: 18px;">
        <div class="form-group">
          <label for="login-email" style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Email ID *</label>
          <input type="email" id="login-email" class="form-control" placeholder="john.doe@example.com" required style="width: 100%;">
        </div>
        <div class="form-group">
          <label for="login-password" style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Password *</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required style="width: 100%;">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Login to Workspace →
        </button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" class="form-panel" onsubmit="handleSignUp(event)" style="gap: 18px;">
        <div class="form-group">
          <label for="signup-name" style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Full Name *</label>
          <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required style="width: 100%;">
        </div>
        <div class="form-group">
          <label for="signup-email" style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Email ID *</label>
          <input type="email" id="signup-email" class="form-control" placeholder="john.doe@example.com" required style="width: 100%;">
        </div>
        <div class="form-group">
          <label for="signup-password" style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Password *</label>
          <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required style="width: 100%; min-length: 6;">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Create Account →
        </button>
      </form>
      
      <div class="footer-note">
        &copy; 2026 SkillTube Portal. Built for continuous tech learning.
      </div>
    </div>
  </div>

  <!-- Script Declarations -->
  <script src="videos.js?v=2.0"></script>
  <script src="app.js?v=2.1"></script>

  <!-- Login interactions -->
  <script>
    // Populate forms if config already cached
    window.addEventListener("DOMContentLoaded", () => {
      if (window.trackerState) {
        if (window.trackerState.userName) {
          document.getElementById("profile-name")?.setAttribute('value', window.trackerState.userName);
        }
      }
    });

    // Tab Switching Logic
    function switchTab(tabId) {
      document.querySelectorAll('.login-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.form-panel').forEach(form => form.classList.remove('active'));
      
      if (tabId === 'login') {
        document.querySelectorAll('.login-tab-btn')[0].classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.querySelectorAll('.login-tab-btn')[1].classList.add('active');
        document.getElementById('signup-form').classList.add('active');
      }
    }

    // Handle Sign Up
    function handleSignUp(event) {
      event.preventDefault();
      const name = document.getElementById("signup-name").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      
      if (!name || !email || !password) {
        alert("Please enter Name, Email ID, and Password to proceed.");
        return;
      }
      if (typeof window.signUpWithEmail === 'function') {
        window.signUpWithEmail(name, email, password);
      } else {
        alert("Firebase Auth is not initialized yet. Wait a moment.");
      }
    }

    // Handle Login
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      
      if (!email || !password) {
        alert("Please enter Email ID and Password to proceed.");
        return;
      }
      if (typeof window.loginWithEmail === 'function') {
        window.loginWithEmail(email, password);
      } else {
        alert("Firebase Auth is not initialized yet. Wait a moment.");
      }
    }
  </script>
</body>
</html>
